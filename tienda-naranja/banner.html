<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1600px; height: 500px; overflow: hidden; background: #f7f8fc; }
    .banner {
      width: 1600px;
      height: 500px;
      position: relative;
      overflow: hidden;
      font-family: "Inter", "Helvetica Neue", Arial, sans-serif;
      background: #f4f6fb url("productos.png") right center / cover no-repeat;
    }
    .veil {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        90deg,
        #f7f8fc 0%,
        #f7f8fc 34%,
        rgba(247, 248, 252, 0.92) 46%,
        rgba(247, 248, 252, 0.35) 62%,
        rgba(247, 248, 252, 0) 76%
      );
    }
    .content {
      position: relative;
      z-index: 2;
      height: 100%;
      width: 820px;
      padding: 54px 0 54px 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .logo {
      width: 280px;
      height: auto;
      display: block;
      margin-bottom: 28px;
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #2a2a6a;
      margin-bottom: 18px;
    }
    .pills {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 22px;
      max-width: 640px;
    }
    .pill {
      background: #ffffff;
      color: #373592;
      border: 1px solid rgba(55, 53, 146, 0.16);
      border-radius: 999px;
      padding: 8px 16px;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.01em;
    }
    .line {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #3a3a55;
      font-size: 18px;
      font-weight: 500;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1498d8, #681b8b);
    }
  </style>
</head>
<body>
  <div class="banner">
    <div class="veil"></div>
    <div class="content">
      <img class="logo" src="logozenn.svg" alt="ZENN" />
      <h1>Tecnología en Paraguay</h1>
      <div class="pills">
        <span class="pill">Notebooks</span>
        <span class="pill">Computadoras</span>
        <span class="pill">Componentes</span>
        <span class="pill">Accesorios</span>
      </div>
      <div class="line"><span class="dot"></span> Envíos a Asunción y todo el país</div>
    </div>
  </div>
</body>
</html>
